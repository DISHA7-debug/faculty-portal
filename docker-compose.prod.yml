# Separate project name from the dev stack — see the note in docker-compose.yml.
name: faculty-prod

# Production stack. App, Redis, and Caddy are always-on via `restart: unless-stopped`.
#
# The database is Neon (external, managed Postgres) — not a service in this file.
# `DATABASE_URL` is `NEON_DATABASE_URL` from `.env`, the pooled (`-pooler`) connection
# string. See docs/CUTOVER.md "Database target" for why, and for the VPS-Postgres
# alternative if Neon's free-tier idle-sleep ever conflicts with the always-on
# requirement above.
#
# Runs with no public domain by default: SITE_ADDRESS falls back to `localhost` and
# Caddy issues a certificate from its own internal CA. Point it at the real hostname
# by setting SITE_ADDRESS and CADDY_TLS in .env — see docs/CUTOVER.md.
services:
  # One-shot migration gate. Runs `prisma migrate deploy`, exits, and the app only
  # starts if it exited 0. This is what keeps a schema change and the code that
  # depends on it from racing each other on boot.
  #
  # It is a separate image stage because the runner image has no node_modules and
  # therefore no Prisma CLI — see the `migrator` stage in the Dockerfile.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: faculty_migrate
    env_file: .env
    environment:
      # Overrides whatever .env says. `environment` beats `env_file` in compose, and
      # .env's bare DATABASE_URL is written for host-side dev (local Postgres on
      # localhost). Migrations run against Neon, so this points at NEON_DATABASE_URL
      # instead — without this override the migrator would try to reach a local
      # Postgres that doesn't exist in this stack.
      DATABASE_URL: ${NEON_DATABASE_URL}
    # No depends_on: Neon isn't a compose service, so there's nothing local to wait on.
    # Explicitly not restarted: this is a task, not a service. A restart loop here
    # would hammer the database and mask a genuinely failing migration.
    restart: "no"
    # `web`, not `internal`: this container needs outbound internet access to reach
    # Neon's host, and `internal` is a Docker `internal: true` network with no egress.
    networks: [web]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: faculty_app
    restart: unless-stopped
    env_file: .env
    environment:
      # These override .env deliberately — see the note on the migrate service.
      #
      # NODE_ENV is the important one: .env ships NODE_ENV=development for host-side
      # work, and env_file takes precedence over the Dockerfile's ENV. Without this
      # line the production image would boot in development mode — React in dev,
      # no production optimisations, and lib/env.ts skipping every production
      # safety assertion, silently.
      NODE_ENV: production
      DATABASE_URL: ${NEON_DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # `web` for Neon egress (and to be reachable from caddy's reverse_proxy), `internal`
    # for redis.
    networks: [web, internal]

  redis:
    image: redis:7-alpine
    container_name: faculty_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    container_name: faculty_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Both default inside the Caddyfile, so an unset value still boots:
      #   SITE_ADDRESS -> localhost      CADDY_TLS -> internal
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      CADDY_TLS: ${CADDY_TLS:-internal}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [web]

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
  internal:
    internal: true
