# Local production-stack verification ONLY. Never deployed.
#
# The production stack talks to Cloudflare R2, which does not exist locally. This overlay
# adds the same MinIO the dev compose uses, on the internal network, so the containerised
# app exercises the real storage path — the point being to catch failures that only appear
# inside the image, such as a native module that will not load on Alpine.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.verify.yml up -d --build
services:
  minio:
    image: minio/minio:latest
    container_name: faculty_minio_verify
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    networks: [internal]

  minio-init:
    image: minio/mc:latest
    container_name: faculty_minio_verify_init
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/faculty-portal-media;
      mc anonymous set download local/faculty-portal-media;
      echo ready;
      "
    restart: "no"
    networks: [internal]

  app:
    environment:
      # Inside the compose network the storage host is the service name.
      R2_ENDPOINT: http://minio:9000
      R2_PUBLIC_URL: http://minio:9000/faculty-portal-media
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_BUCKET: faculty-portal-media
      S3_FORCE_PATH_STYLE: "true"
    networks: [web, internal]
